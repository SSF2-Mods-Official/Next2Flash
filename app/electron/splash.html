<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Next2Flash</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  -webkit-app-region: drag;
}
.title {
  font-size: 28px;
  font-weight: 700;

  letter-spacing: 1px;

.spinner-wrap {
  display: flex;
  align-items: center;

}
.spinner {
  width: 22px;
  height: 22px;
  border: 3px solid #333;
  border-top-color: #4fc3f7;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#status {
  font-size: 13px;
  color: #aaa;
}
</style>
</head>
