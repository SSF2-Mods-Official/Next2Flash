<!DOCTYPE html>
<html>
<head>
    <title>Lazy Loading Test</title>
</head>
<body>
    <h1>Testing Lazy Loading with menu_characters.ssf</h1>
    <div id="status">Loading...</div>
    <script>
        // Load the N2D file and check for errors
        fetch('/converted/menu_characters.n2d')
            .then(r => r.blob())
            .then(blob => {
                document.getElementById('status').textContent = 'N2D loaded, file size: ' + blob.size;
                
                // Feed it to the tool
                if (window._feedN2DToTool) {
                    window._feedN2DToTool(blob, 'menu_characters');
                    
                    // Wait a bit and check for errors
                    setTimeout(() => {
                        const errors = document.querySelectorAll('.error, [class*="error"]');
                        if (errors.length === 0) {
                            document.getElementById('status').textContent = 'SUCCESS - No errors detected!';
                            document.getElementById('status').style.color = 'green';
                        } else {
                            document.getElementById('status').textContent = 'FAILED - Errors found';
                            document.getElementById('status').style.color = 'red';
                        }
                    }, 3000);
                } else {
                    document.getElementById('status').textContent = 'Tool not loaded yet';
                }
            })
            .catch(e => {
                document.getElementById('status').textContent = 'Error: ' + e.message;
                document.getElementById('status').style.color = 'red';
            });
    </script>
</body>
</html>
