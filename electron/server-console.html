<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>N2F Server Console</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Consolas', 'Monaco', monospace;
  background: #1e1e1e;
  color: #d4d4d4;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  background: #2d2d2d;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #3e3e3e;
}
header h1 { font-size: 14px; color: #4fc3f7; }
header button {
  background: #3e3e3e;
  color: #d4d4d4;
  border: 1px solid #555;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 12px;
  border-radius: 3px;
}
header button:hover { background: #505050; }
#status {
  margin-left: auto;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
}
#status-dot.stopped { background: #f44336; }
#status-dot.starting { background: #ff9800; }
#status-text { color: #888; }

#log {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-line { }
.log-stdout { color: #d4d4d4; }
.log-stderr { color: #f48771; }
.log-system { color: #4fc3f7; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Server Console</h1>
  <button id="btn-clear">Clear</button>
  <div id="status">
    <div id="status-dot" class="starting"></div>
    <span id="status-text">Starting...</span>
  </div>
</header>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const MAX_LINES = 5000;
let lineCount = 0;

function appendLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'log-line ' + cls;
  div.textContent = text;
  logEl.appendChild(div);
  lineCount++;
  // Trim old lines to avoid unbounded memory
  while (lineCount > MAX_LINES) {
    logEl.removeChild(logEl.firstChild);
    lineCount--;
  }
  // Auto-scroll if near bottom
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(state, text) {
  statusDot.className = 'stopped';
  if (state === 'running') statusDot.className = '';
  else if (state === 'starting') statusDot.className = 'starting';
  statusText.textContent = text;
}

document.getElementById('btn-clear').addEventListener('click', () => {
  logEl.innerHTML = '';
  lineCount = 0;
});

window.n2fConsole.onLog((data) => {
  appendLine(data.text, 'log-' + data.stream);
});

window.n2fConsole.onStatus((state, text) => {
  setStatus(state, text);
});

setStatus('starting', 'Starting...');
</script>
</body>
</html>
