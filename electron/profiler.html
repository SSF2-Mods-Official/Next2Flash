<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>N2F Performance Profiler</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Consolas', 'Monaco', monospace;
  background: #1e1e1e;
  color: #d4d4d4;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  background: #2d2d2d;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #3e3e3e;
}
header h1 { font-size: 14px; color: #4fc3f7; }
header button {
  background: #3e3e3e;
  color: #d4d4d4;
  border: 1px solid #555;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 12px;
  border-radius: 3px;
}
header button:hover { background: #505050; }
#status { margin-left: auto; font-size: 11px; color: #888; }

.main {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

/* ── Graph Panel ── */
#graph-panel {
  height: 200px;
  min-height: 100px;
  background: #252526;
  border-bottom: 1px solid #3e3e3e;
  position: relative;
  overflow: hidden;
}
#graph-canvas {
  width: 100%;
  height: 100%;
}
#graph-legend {
  position: absolute;
  top: 6px;
  right: 10px;
  font-size: 10px;
  color: #888;
  display: flex;
  gap: 12px;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Resize Handle ── */
.resize-handle {
  height: 4px;
  background: #3e3e3e;
  cursor: ns-resize;
}
.resize-handle:hover { background: #4fc3f7; }

/* ── Log Panel ── */
#log-panel {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  font-size: 12px;
  line-height: 1.6;
}
.log-entry {
  padding: 1px 16px;
  white-space: pre;
  border-left: 3px solid transparent;
}
.log-entry:hover { background: #2a2a2a; }
.log-entry.timer { border-left-color: #4fc3f7; }
.log-entry.session { border-left-color: #c792ea; color: #c792ea; font-weight: bold; }
.log-entry.warn { border-left-color: #ffb74d; color: #ffb74d; }
.log-entry.error { border-left-color: #ef5350; color: #ef5350; }
.log-entry.fetch { border-left-color: #81c784; }
.log-entry.metric { border-left-color: #ffd54f; }

.log-time { color: #666; margin-right: 8px; }
.log-ms { color: #4fc3f7; }
.log-slow { color: #ffb74d; }
.log-very-slow { color: #ef5350; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #1e1e1e; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* ── Filter bar ── */
#filter-bar {
  background: #2d2d2d;
  padding: 4px 16px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid #3e3e3e;
  font-size: 11px;
}
#filter-bar label { display: flex; align-items: center; gap: 3px; cursor: pointer; color: #aaa; }
#filter-bar input[type="checkbox"] { accent-color: #4fc3f7; }
</style>
</head>
<body>
<header>
  <h1>⚡ N2F Profiler</h1>
  <button id="btn-clear">Clear</button>
  <button id="btn-export">Export Log</button>
  <span id="status">Waiting for events...</span>
</header>
<div class="main">
  <div id="graph-panel">
    <canvas id="graph-canvas"></canvas>
    <div id="graph-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4fc3f7"></div>FPS</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c792ea"></div>Heap MB</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ffb74d"></div>Event spike</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div>Slow (&gt;1s)</div>
    </div>
  </div>
  <div class="resize-handle" id="resize-handle"></div>
  <div id="filter-bar">
    <label><input type="checkbox" data-type="timer" checked> Timers</label>
    <label><input type="checkbox" data-type="fetch" checked> Fetch</label>
    <label><input type="checkbox" data-type="session" checked> Sessions</label>
    <label><input type="checkbox" data-type="metric" checked> Metrics</label>
    <label><input type="checkbox" data-type="warn" checked> Warnings</label>
    <label><input type="checkbox" data-type="error" checked> Errors</label>
    <label><input type="checkbox" data-type="heartbeat"> Heartbeats</label>
  </div>
  <div id="log-panel"></div>
</div>

<script>
const logPanel = document.getElementById('log-panel');
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let events = [];
let eventCount = 0;
let autoScroll = true;

// ── Graph Data (continuous timeline) ──
const GRAPH_MAX_POINTS = 200;
let fpsHistory = [];    // {fps, heapMB, domNodes}
let spikeHistory = [];  // {index, ms, type} — event spikes overlaid on the timeline

function resizeCanvas() {
  const panel = document.getElementById('graph-panel');
  canvas.width = panel.clientWidth * devicePixelRatio;
  canvas.height = panel.clientHeight * devicePixelRatio;
  canvas.style.width = panel.clientWidth + 'px';
  canvas.style.height = panel.clientHeight + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  drawGraph();
}

function drawGraph() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  if (fpsHistory.length === 0) {
    ctx.fillStyle = '#555';
    ctx.font = '12px Consolas';
    ctx.fillText('Waiting for heartbeat data...', w / 2 - 90, h / 2);
    return;
  }

  const pad = { l: 40, r: 10, t: 10, b: 20 };
  const gw = w - pad.l - pad.r;
  const gh = h - pad.t - pad.b;
  const xStep = gw / GRAPH_MAX_POINTS;

  // ── FPS line (left Y axis, 0-120) ──
  const maxFps = 120;
  const fpsScale = gh / maxFps;

  // Grid
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.5;
  for (const fps of [15, 30, 60]) {
    const y = pad.t + gh - fps * fpsScale;
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.fillStyle = '#444';
    ctx.font = '9px Consolas';
    ctx.fillText(fps + ' fps', 2, y + 3);
  }

  // FPS area fill
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t + gh);
  for (let i = 0; i < fpsHistory.length; i++) {
    const x = pad.l + i * xStep;
    const y = pad.t + gh - Math.min(fpsHistory[i].fps, maxFps) * fpsScale;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(pad.l + (fpsHistory.length - 1) * xStep, pad.t + gh);
  ctx.closePath();
  ctx.fillStyle = 'rgba(79,195,247,0.12)';
  ctx.fill();

  // FPS line
  ctx.beginPath();
  ctx.strokeStyle = '#4fc3f7';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < fpsHistory.length; i++) {
    const x = pad.l + i * xStep;
    const y = pad.t + gh - Math.min(fpsHistory[i].fps, maxFps) * fpsScale;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Heap line (right scale, auto)
  const maxHeap = Math.max(100, ...fpsHistory.map(h => h.heapMB));
  const heapScale = gh / maxHeap;
  ctx.beginPath();
  ctx.strokeStyle = '#c792ea';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 2]);
  for (let i = 0; i < fpsHistory.length; i++) {
    const x = pad.l + i * xStep;
    const y = pad.t + gh - fpsHistory[i].heapMB * heapScale;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Heap label
  if (fpsHistory.length > 0) {
    const last = fpsHistory[fpsHistory.length - 1];
    ctx.fillStyle = '#c792ea';
    ctx.font = '9px Consolas';
    ctx.fillText(last.heapMB + 'MB', w - pad.r - 35, pad.t + gh - last.heapMB * heapScale - 4);
  }

  // ── Event spike bars ──
  for (const spike of spikeHistory) {
    if (spike.index < 0 || spike.index >= GRAPH_MAX_POINTS) continue;
    const x = pad.l + spike.index * xStep;
    const spikeH = Math.min(gh * 0.8, Math.max(4, Math.log10(spike.ms + 1) * gh * 0.2));
    const y = pad.t + gh - spikeH;

    ctx.fillStyle = spike.ms > 1000 ? '#ef5350' : spike.ms > 100 ? '#ffb74d' : '#81c784';
    ctx.globalAlpha = 0.7;
    ctx.fillRect(x - 1, y, 3, spikeH);
    ctx.globalAlpha = 1;
  }

  // Current FPS display
  const lastFps = fpsHistory[fpsHistory.length - 1].fps;
  ctx.fillStyle = lastFps < 20 ? '#ef5350' : lastFps < 40 ? '#ffb74d' : '#4fc3f7';
  ctx.font = 'bold 14px Consolas';
  ctx.fillText(lastFps + ' FPS', pad.l + 4, pad.t + 16);
}

function formatTime(date) {
  return date.toTimeString().slice(0, 8) + '.' + String(date.getMilliseconds()).padStart(3, '0');
}

function formatMs(ms) {
  if (ms >= 5000) return `<span class="log-very-slow">${(ms/1000).toFixed(2)}s</span>`;
  if (ms >= 1000) return `<span class="log-slow">${(ms/1000).toFixed(2)}s</span>`;
  if (ms > 0) return `<span class="log-ms">${ms.toFixed(1)}ms</span>`;
  return '';
}

function addLogEntry(event) {
  events.push(event);
  eventCount++;

  // Don't add heartbeat DOM entries by default (too noisy), just update graph
  if (event.type === 'heartbeat') {
    fpsHistory.push({ fps: event.raw.fps || 0, heapMB: event.raw.heapMB || 0, domNodes: event.raw.domNodes || 0 });
    if (fpsHistory.length > GRAPH_MAX_POINTS) {
      fpsHistory.shift();
      // Shift spike indices
      spikeHistory = spikeHistory.map(s => ({ ...s, index: s.index - 1 })).filter(s => s.index >= 0);
    }
    statusEl.textContent = `${eventCount} events | ${event.raw.fps} FPS | ${event.raw.heapMB}MB heap | ${event.raw.domNodes} DOM`;
    drawGraph();
    return;
  }

  // Add spike to graph for timed events
  if (event.ms !== undefined && event.ms > 0) {
    spikeHistory.push({ index: fpsHistory.length - 1, ms: event.ms, type: event.type });
    if (spikeHistory.length > 100) spikeHistory.shift();
    drawGraph();
  }

  const div = document.createElement('div');
  div.className = `log-entry ${event.type}`;
  div.dataset.type = event.type;

  const timeStr = `<span class="log-time">${formatTime(event.time)}</span>`;
  const msStr = event.ms !== undefined ? '  ' + formatMs(event.ms) : '';
  div.innerHTML = `${timeStr}${escapeHtml(event.label)}${msStr}`;

  logPanel.appendChild(div);
  if (autoScroll) logPanel.scrollTop = logPanel.scrollHeight;

  statusEl.textContent = `${eventCount} events` + (fpsHistory.length ? ` | ${fpsHistory[fpsHistory.length-1].fps} FPS` : '');
  applyFilters();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Receive events from main process ──
window.n2fProfiler.onEvent((event) => {
  addLogEntry({
    time: new Date(),
    type: event.type || 'timer',
    label: event.label || event.name || '',
    ms: event.ms ?? event.elapsed_ms,
    raw: event,
  });
});

// ── Filters ──
function applyFilters() {
  const checked = {};
  document.querySelectorAll('#filter-bar input').forEach(cb => {
    checked[cb.dataset.type] = cb.checked;
  });
  document.querySelectorAll('.log-entry').forEach(el => {
    el.style.display = checked[el.dataset.type] !== false ? '' : 'none';
  });
}
document.querySelectorAll('#filter-bar input').forEach(cb => {
  cb.addEventListener('change', applyFilters);
});

// ── Auto-scroll detection ──
logPanel.addEventListener('scroll', () => {
  autoScroll = logPanel.scrollTop + logPanel.clientHeight >= logPanel.scrollHeight - 20;
});

// ── Clear ──
document.getElementById('btn-clear').addEventListener('click', () => {
  events = [];
  fpsHistory = [];
  spikeHistory = [];
  eventCount = 0;
  logPanel.innerHTML = '';
  statusEl.textContent = 'Cleared';
  drawGraph();
});

// ── Export ──
document.getElementById('btn-export').addEventListener('click', () => {
  window.n2fProfiler.exportLog();
});

// ── Resize handle ──
const resizeHandle = document.getElementById('resize-handle');
const graphPanel = document.getElementById('graph-panel');
let resizing = false;
resizeHandle.addEventListener('mousedown', (e) => {
  resizing = true;
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!resizing) return;
  const newH = Math.max(60, Math.min(500, e.clientY - graphPanel.offsetTop));
  graphPanel.style.height = newH + 'px';
  resizeCanvas();
});
document.addEventListener('mouseup', () => { resizing = false; });

// ── Init ──
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
